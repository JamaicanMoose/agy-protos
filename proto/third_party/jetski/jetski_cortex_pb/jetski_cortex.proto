syntax = "proto3";

package exa.jetski_cortex_pb;

import "third_party/jetski/codeium_common_pb/credits.proto";

import "google/protobuf/timestamp.proto";

import "third_party/gemini_coder/proto/trajectory.proto";

import "third_party/jetski/opensearch_clients_pb/cortex.proto";

option go_package = "third_party/jetski/jetski_cortex_pb;jetski_cortex_pb";

option java_multiple_files = true;

option java_package = "com.exafunction.codeium.jetskicortex";

message BackgroundTask {
  exa.cortex_pb.TaskSnapshot task_snapshot = 1;

  gemini_coder.Step step = 2;
}

message AgentStateUpdate {
  string conversation_id = 1;

  string trajectory_id = 2;

  exa.cortex_pb.CascadeRunStatus status = 3;

  exa.cortex_pb.CascadeRunStatus executable_status = 4;

  exa.cortex_pb.CascadeRunStatus executor_loop_status = 5;

  exa.cortex_pb.ExecutorMetadata executor_metadata = 6;

  TrajectoryUpdate main_trajectory_update = 7;

  map<string, TrajectoryUpdate> subtrajectory_updates = 8;

  map<uint32, TrajectoryUpdate> step_scoped_subtrajectory_updates = 13 [deprecated = true];

  QueuedStepsUpdate queued_steps_update = 9;

  ArtifactSnapshotsUpdate artifact_snapshots_update = 10;

  TrajectoryFileDiffsUpdate trajectory_file_diffs_update = 11;

  BackgroundCommandsUpdate background_commands_update = 12 [deprecated = true];

  BackgroundTasksUpdate background_tasks_update = 17;

  bool has_active_children = 14 [deprecated = true];

  CreditUsageSummary credit_usage_summary = 15;

  ConversationCostSummary cost_summary = 16;

  bool fully_idle = 18;

  CompactionInfo compaction_info = 19;

  PendingAgentMessagesUpdate pending_agent_messages_update = 20;

  repeated string bookmarks = 21;

  AccumulatedSectionsUpdate accumulated_sections_update = 22;

  HookStatus active_hook = 23;

  map<int32, HookStatus> step_hooks = 24;
}

message AccumulatedSectionsUpdate {
  repeated exa.cortex_pb.AccumulatedSection accumulated_sections = 1;
}

message CompactionInfo {
  repeated int32 compacted_at_step_indices = 1;
}

message HookStatus {
  HookType hook_type = 1;

  string hook_name = 2;

  google.protobuf.Timestamp started_at = 3;
}

message ModelPricingInfo {
  float input_price_per_million_tokens = 1;

  float output_price_per_million_tokens = 2;

  float cache_read_price_per_million_tokens = 3;

  string model_name = 4;

  bool is_estimated = 5;
}

message CostCategory {
  int64 tokens = 1;

  float estimated_cost_usd = 2;
}

message CostDisplaySection {
  CostCategory input = 1;

  CostCategory cache_read = 2;

  CostCategory output = 3;

  CostCategory thinking = 4;

  CostCategory response = 5;

  CostCategory tools = 6 [deprecated = true];

  map<string, CostCategory> tool_breakdown = 7 [deprecated = true];

  int32 generation_count = 8;

  float estimated_cost_usd = 9;

  ModelPricingInfo pricing = 10;
}

message TurnCostSummary {
  CostDisplaySection turn = 1;

  CostDisplaySection subagent = 2;

  CostDisplaySection cumulative_total = 3;
}

message ConversationCostSummary {
  map<string, TurnCostSummary> turn_costs = 1;

  TurnCostSummary total = 2;

  ModelPricingInfo pricing = 3 [deprecated = true];

  map<string, CostDisplaySection> subagent_costs = 4;
}

message TrajectoryUpdate {
  StepsUpdate steps_update = 1;

  GeneratorMetadatasUpdate generator_metadatas_update = 2;

  ExecutorMetadatasUpdate executor_metadatas_update = 3;

  optional exa.cortex_pb.CortexTrajectoryType trajectory_type = 4;

  exa.cortex_pb.CortexTrajectoryMetadata metadata = 5;

  exa.cortex_pb.CascadeRunStatus status = 6;

  exa.cortex_pb.CortexErrorDetails last_step_error = 7;

  exa.cortex_pb.CortexStepType last_step_type = 8;

  repeated CortexTrajectoryStepWithIndex waiting_steps = 9;

  bool fully_idle = 10;

  bool killed = 11;

  repeated exa.cortex_pb.CortexTrajectoryReference parent_references = 12;

  BattleModeInfosUpdate battle_mode_infos_update = 13;
}

message StepsUpdate {
  repeated uint32 indices = 1;

  repeated gemini_coder.Step steps = 2;

  uint32 total_length = 3;

  Slice page_bounds = 4;
}

message GeneratorMetadatasUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.CortexStepGeneratorMetadata generator_metadatas = 2;

  uint32 total_length = 3;

  Slice page_bounds = 4;
}

message ExecutorMetadatasUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.ExecutorMetadata executor_metadatas = 2;

  uint32 total_length = 3;

  Slice page_bounds = 4;
}

message BattleModeInfosUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.BattleModeInfo battle_mode_infos = 2;

  uint32 total_length = 3;
}

message QueuedStepsUpdate {
  repeated uint32 indices = 1;

  repeated gemini_coder.Step queued_steps = 2;

  uint32 total_length = 3;
}

message ArtifactSnapshotsUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.ArtifactSnapshot artifact_snapshots = 2;

  uint32 total_length = 3;
}

message TrajectoryFileDiffsUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.TrajectoryFileDiff trajectory_file_diffs = 2;

  uint32 total_length = 3;
}

message BackgroundCommandsUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.BackgroundCommand background_commands = 2;

  uint32 total_length = 3;
}

message BackgroundTasksUpdate {
  repeated uint32 indices = 1;

  repeated BackgroundTask background_tasks = 2;

  uint32 total_length = 3;
}

message PendingAgentMessagesUpdate {
  repeated uint32 indices = 1;

  repeated exa.cortex_pb.AgentMessage pending_agent_messages = 2;

  uint32 total_length = 3;
}

message ConsumedCredits {
  repeated google.internal.cloud.code.v1internal.Credits credits = 1;

  uint32 first_step_index = 2;

  uint32 last_step_index = 3;
}

message CreditUsageSummary {
  repeated ConsumedCredits consumed_credits = 1;
}

message ImplicitTrajectory {
  reserved 2, 3, 4, 6, 7;

  reserved "background_research", "mainline_step_count_at_last_research", "workspace_uri", "git_root_uri", "branch_name";

  gemini_coder.Trajectory trajectory = 1;

  exa.cortex_pb.TrajectoryScope trajectory_scope = 5;
}

message BaseTrajectoryIdentifier {
  oneof identifier {
    string cascade_id = 1;

    string implicit_trajectory_file_uri = 2 [deprecated = true];

    bool last_active_doc = 3 [deprecated = true];

    gemini_coder.Trajectory trajectory = 4;

    ForkFromIdentifier fork_from = 5;
  }
}

message ForkFromIdentifier {
  string cascade_id = 1;

  int32 step_index = 2;

  exa.cortex_pb.CortexTrajectoryReferenceType reference_type = 3;
}

message CortexTrajectoryStepWithIndex {
  gemini_coder.Step step = 1;

  uint32 step_index = 2;
}

message ConversationAnnotations {
  reserved 2;

  optional string title = 1;

  repeated string tags = 3;

  optional bool archived = 4;

  google.protobuf.Timestamp archival_status_timestamp = 5;

  optional bool starred = 6;

  google.protobuf.Timestamp last_user_view_time = 7;

  optional bool marked_as_unread = 8;

  optional string group_id = 9 [deprecated = true];

  optional int32 group_index = 10 [deprecated = true];

  optional string group_description = 11 [deprecated = true];

  optional bool pinned = 12;

  repeated int64 cls = 13;

  optional string active_profile = 14 [deprecated = true];

  optional string conversation_group_id = 15;
}

message CascadeTrajectorySummary {
  reserved 6, 11, 13;

  string summary = 1;

  uint32 step_count = 2;

  google.protobuf.Timestamp last_modified_time = 3;

  string trajectory_id = 4;

  exa.cortex_pb.CascadeRunStatus status = 5;

  google.protobuf.Timestamp created_time = 7;

  repeated CortexTrajectoryStepWithIndex waiting_steps = 8;

  repeated exa.cortex_pb.CortexWorkspaceMetadata workspaces = 9;

  google.protobuf.Timestamp last_user_input_time = 10;

  optional uint32 last_user_input_step_index = 16;

  CortexTrajectoryStepWithIndex latest_notify_user_step = 12 [deprecated = true];

  CortexTrajectoryStepWithIndex latest_task_boundary_step = 14 [deprecated = true];

  ConversationAnnotations annotations = 15;

  exa.cortex_pb.CortexTrajectoryMetadata trajectory_metadata = 17;

  bool has_active_children = 18 [deprecated = true];

  exa.cortex_pb.BattleModeInfo battle_mode_info = 19;

  exa.cortex_pb.CortexTrajectorySource source = 20;

  bool not_fully_idle = 21;

  exa.cortex_pb.CortexTrajectoryType trajectory_type = 22;

  optional bool killed = 23;

  string fork_parent_conversation_id = 24;

  bool interrupted = 25;
}

message Slice {
  int32 start_index = 1;

  optional int32 end_index_exclusive = 2;
}

message StreamAgentStateUpdatesRequest {
  string conversation_id = 1;

  string subscriber_id = 2;

  Slice initial_steps_page_bounds = 3;

  ClientTrajectoryVerbosity trajectory_verbosity = 4;

  Slice initial_generator_metadatas_page_bounds = 5;

  Slice initial_executor_metadatas_page_bounds = 6;

  bool disable_rehydration = 7;

  bool enable_latency_telemetry = 8;
}

message StreamAgentStateUpdatesResponse {
  AgentStateUpdate update = 1;
}

message AgentStatePageUpdateRequest {
  string conversation_id = 1;

  string subscriber_id = 2;

  Slice step_page_bounds = 3;

  Slice generator_metadatas_page_bounds = 4;

  Slice executor_metadatas_page_bounds = 5;
}

message AgentStatePageUpdateResponse {
}

enum HookType {
  HOOK_TYPE_UNSPECIFIED = 0;

  HOOK_TYPE_PRE_INVOCATION = 1;

  HOOK_TYPE_POST_INVOCATION = 2;

  HOOK_TYPE_STOP = 3;

  HOOK_TYPE_PRE_TOOL_USE = 4;

  HOOK_TYPE_POST_TOOL_USE = 5;
}

enum ClientTrajectoryVerbosity {
  CLIENT_TRAJECTORY_VERBOSITY_UNSPECIFIED = 0;

  CLIENT_TRAJECTORY_VERBOSITY_DEBUG = 1 [deprecated = true];

  CLIENT_TRAJECTORY_VERBOSITY_PROD_UI = 2;

  CLIENT_TRAJECTORY_VERBOSITY_FULL = 3;
}
