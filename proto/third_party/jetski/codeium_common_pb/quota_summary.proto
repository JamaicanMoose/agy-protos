syntax = "proto3";

package google.internal.cloud.code.v1internal;

import "google/protobuf/timestamp.proto";

option go_package = "third_party/jetski/codeium_common_pb;codeium_common_pb";

option java_multiple_files = true;

option java_outer_classname = "QuotaSummaryProto";

option java_package = "com.google.internal.cloud.code.v1internal";

message RetrieveUserQuotaSummaryRequest {
  string project = 1;
}

message QuotaSummaryBucket {
  string bucket_id = 1;

  string display_name = 2;

  string description = 7;

  string window = 3;

  oneof remaining {
    float remaining_fraction = 4;

    int64 remaining_amount = 5;
  }

  bool disabled = 8;

  google.protobuf.Timestamp reset_time = 6;
}

message QuotaSummaryGroup {
  string display_name = 2;

  string description = 3;

  repeated QuotaSummaryBucket buckets = 1;
}

message QuotaSummaryModelAvailability {
  ModelAvailabilityState state = 1;

  string explanation = 2;
}

message RetrieveUserQuotaSummaryResponse {
  repeated QuotaSummaryBucket buckets = 1 [deprecated = true];

  repeated QuotaSummaryGroup groups = 2;

  string description = 3;

  map<string, QuotaSummaryModelAvailability> model_availabilities = 4;

  repeated QuotaSummaryBankedReset banked_resets = 5;
}

message QuotaSummaryBankedReset {
  string reset_id = 1;

  string display_label = 2;

  google.protobuf.Timestamp expire_time = 3;

  bool claimable = 4;

  QuotaSummaryBankedResetIneligibleReason ineligible_reason = 5;

  int32 remaining_count = 6;

  repeated string bucket_ids = 7;
}

enum QuotaSummaryBankedResetIneligibleReason {
  QUOTA_SUMMARY_BANKED_RESET_INELIGIBLE_REASON_UNSPECIFIED = 0;

  QUOTA_SUMMARY_BANKED_RESET_INELIGIBLE_REASON_USAGE_BELOW_THRESHOLD = 1;
}

enum ModelAvailabilityState {
  MODEL_AVAILABILITY_STATE_UNSPECIFIED = 0;

  MODEL_AVAILABILITY_STATE_OPERATIONAL = 1;

  MODEL_AVAILABILITY_STATE_HIGH_TRAFFIC = 2;

  MODEL_AVAILABILITY_STATE_CONGESTED = 3;
}
