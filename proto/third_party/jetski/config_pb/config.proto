syntax = "proto3";

package exa.config_pb;

import "third_party/jetski/opensearch_clients_pb/cortex.proto";

import "third_party/jetski/jetbox_state_pb/jetbox_state.proto";

option go_package = "third_party/jetski/config_pb;config_pb";

option java_multiple_files = true;

option java_package = "com.exafunction.codeium.config";

message UserConfig {
  map<string, exa.cortex_pb.SidecarUserConfig> sidecars = 1;

  jetbox_state_pb.UserSettings user_settings = 2;

  map<string, PluginUserConfig> plugins = 3;

  optional ConversationGroupRegistry conversation_groups = 4;

  map<string, SkillUserConfig> skills = 5;
}

message ConversationGroupRegistry {
  map<string, ConversationGroupConfig> groups = 1;
}

message ConversationGroupConfig {
  optional string name = 1;

  optional int32 sort_order = 2;
}

message PluginUserConfig {
  optional bool enabled = 1;

  optional exa.cortex_pb.MarketplaceInstall installed_from = 2;

  map<string, PluginMcpUserConfig> mcp = 3;
}

message PluginMcpUserConfig {
  map<string, string> variables = 1;
}

message SkillUserConfig {
  optional exa.cortex_pb.MarketplaceInstall installed_from = 1;
}
