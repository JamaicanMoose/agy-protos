syntax = "proto3";

package exa.vcs_pb;

option go_package = "third_party/jetski/vcs_pb;vcs_pb";

message VcsFileChange {
  string uri = 1;

  Operation operation = 2;

  optional string original_uri = 3;

  optional string content_hash = 4;

  enum Operation {
    OPERATION_UNKNOWN = 0;

    OPERATION_ADDED = 1;

    OPERATION_MODIFIED = 2;

    OPERATION_DELETED = 3;

    OPERATION_RENAMED = 4;

    OPERATION_COPIED = 5;
  }
}

message VcsConflictFile {
  string path = 1 [deprecated = true];

  Side yours = 2;

  Side theirs = 3;

  string uri = 4;

  message Side {
    optional string label = 2;
  }
}

message VcsConflictState {
  bool in_conflict = 1;

  Operation operation = 2;

  repeated VcsConflictFile conflicts = 3;

  enum Operation {
    OPERATION_UNKNOWN = 0;

    OPERATION_MERGE = 1;

    OPERATION_REBASE = 2;

    OPERATION_CHERRY_PICK = 3;

    OPERATION_EVOLVE = 4;
  }
}

message VcsCommit {
  string id = 1;

  optional string change_id = 2;

  repeated string parent_ids = 3;

  Author author = 4;

  int64 timestamp_ms = 5;

  Message message = 6;

  Status status = 7;

  Refs refs = 8;

  optional Evolution evolution = 9;

  optional Lineage lineage = 10;

  message Author {
    string name = 1;

    optional string email = 2;

    optional string ldap = 3;
  }

  message Message {
    string subject = 1;

    string description = 2;
  }

  message Status {
    bool is_active = 1;

    bool is_submitted = 2;

    bool is_draft = 3;

    optional bool is_secret = 4;

    optional bool is_empty = 5;

    optional bool has_conflict = 6;
  }

  message Refs {
    repeated string branches = 1;

    repeated string bookmarks = 2;

    repeated string tags = 3;
  }

  message Evolution {
    bool is_obsolete = 1;

    bool is_orphaned = 2;

    bool is_divergent = 3;

    repeated string successors = 4;

    repeated string precursors = 5;
  }

  message Lineage {
    bool is_trunk = 1;

    optional int64 trunk_order = 2;
  }
}

message VcsWorkspaceState {
  VcsType vcs_type = 1;

  optional string current_ref = 2;

  optional string active_commit_id = 3;

  repeated VcsCommit commits = 4;

  repeated VcsFileChange working_directory_changes = 5;

  optional VcsConflictState conflict_state = 6;

  repeated VcsFileChange staged_changes = 7;

  repeated VcsFileChange branch_changes = 8;

  optional string merge_base_commit_id = 9;

  optional string target_branch = 10;

  optional string upstream_branch = 13;

  optional int32 commits_ahead = 14;

  optional int32 commits_behind = 15;

  optional bool has_push_remote = 16;

  optional string repo_path = 11;

  repeated VcsWorkspaceState sub_repos = 12;
}

message JJWorktree {
  reserved 1;

  string base_commit_description = 2;

  string uri = 3;
}

enum VcsType {
  VCS_TYPE_UNSPECIFIED = 0;

  VCS_TYPE_PIPER = 1;

  VCS_TYPE_FIG = 2;

  VCS_TYPE_JJ = 3;

  VCS_TYPE_GIT = 4;

  VCS_TYPE_GOB_REPO = 5;

  VCS_TYPE_GOB_COG = 6;
}
