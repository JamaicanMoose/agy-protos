syntax = "proto3";

package exa.remote_agent_proxy_pb;

import "google/protobuf/timestamp.proto";

import "google/rpc/code.proto";

import "third_party/jetski/codeium_common_pb/codeium_common.proto";

option go_package = "third_party/jetski/remote_agent_proxy_pb;remote_agent_proxy_pb";

option java_multiple_files = true;

option java_outer_classname = "RemoteAgentProxySharedProto";

option java_package = "com.exafunction.codeium.remoteagentproxy";

message Environment {
  oneof provider {
    CapsuleConfig capsule = 1;

    AceConfig ace = 3 [deprecated = true];
  }

  string execution_identity = 2;

  message CapsuleConfig {
    string capsule_id = 1;
  }

  message AceConfig {
    option deprecated = true;
  }
}

message EnvironmentInfo {
  oneof provider {
    Capsule capsule = 1;

    Ace ace = 3 [deprecated = true];
  }

  bool is_default = 2;

  ConnectionState connection_state = 4;

  message Capsule {
    string capsule_id = 1;

    repeated string tags = 2;

    google.protobuf.Timestamp expiration_time = 3;
  }

  message Ace {
    option deprecated = true;
  }

  enum ConnectionState {
    CONNECTION_STATE_UNSPECIFIED = 0;

    STARTING = 1;

    CONNECTED = 2;

    DISCONNECTED = 3;
  }
}

message ConfigOverrides {
  exa.codeium_common_pb.Model model = 1;

  ModelTier model_tier = 2;

  bool autonomous = 3;

  exa.codeium_common_pb.AgentPermissionPreset permission_preset = 4;

  string finish_tool_schema_json = 5;
}

message FieldSpec {
  string name = 1;

  string display_name = 2;

  string description = 3;

  bool is_required = 4;

  bool is_repeated = 5;

  string placeholder = 6;

  repeated string allowed_values = 7;

  bool is_cel_only = 8;

  string cel_type = 9;

  bool is_primary = 10;

  repeated string supported_event_types = 11;

  bool match_any_supported_event_type = 12;

  bool supports_self = 13;

  string self_label = 14;

  string requires_field = 15;
}

message TriggerOption {
  string id = 1;

  string display_name = 2;

  string description = 3;

  TriggerCategory category = 4;

  repeated FieldSpec fields = 5;

  bool oauth_consent_required = 6;

  string oauth_authorize_uri = 7;

  TriggerDeliveryPath delivery_path = 8;

  string connector_surface = 9;
}

message FieldValues {
  repeated string values = 1;
}

message RemoteTrigger {
  reserved 2;

  reserved "trigger_source";

  string trigger_id = 1;

  TriggerState state = 3;

  string display_name = 4;

  string prompt = 5;

  repeated string workspace_uris = 6;

  Environment environment = 7;

  ConfigOverrides config_overrides = 8;

  google.protobuf.Timestamp create_time = 9;

  google.protobuf.Timestamp update_time = 10;

  string option_id = 11;

  map<string, FieldValues> fields = 12;

  string summary = 13;

  google.protobuf.Timestamp credential_expiration_time = 14;

  string project_id = 15;

  string interaction_id = 16;

  TriggerConversationMode conversation_mode = 17;

  TriggerInFlightPolicy in_flight_policy = 18;

  google.protobuf.Timestamp last_fired_time = 19;

  string static_session_key = 20;

  TriggerDeliveryPath delivery_path = 21;

  TriggerWatchMode watch_mode = 22;

  google.rpc.Code last_error_code = 23;

  string managed_by_connector = 24;
}

message ResourceProviderInfo {
  string type = 1;

  string display_name = 2;

  string icon_url = 3;
}

message PluginConnection {
  string connection_id = 1;

  State state = 2;

  repeated string granted_scopes = 3;

  string account = 4;

  enum State {
    STATE_UNSPECIFIED = 0;

    CONNECTED = 1;

    EXPIRED = 2;
  }
}

message PluginInfo {
  string plugin_id = 1;

  string display_name = 2;

  string version = 3;

  string description = 4;

  string logo_uri = 5;

  bool auth_required = 6;

  repeated PluginConnection connections = 7;

  string authorize_uri = 8;

  string credential_key = 9;

  string connect_uri = 10;

  string bundle_uri = 11;

  string catalog_id = 12;

  PluginAuthor author = 13;

  string homepage_url = 14;

  string repository_url = 15;

  repeated PluginSkill skills = 16;

  repeated PluginMcpServerSummary mcp_servers = 17;

  PluginVariableSpec variable_spec = 18;

  repeated PluginSidecarSummary sidecars = 19;
}

message PluginSidecarSummary {
  string sidecar_id = 1;

  string display_name = 2;

  bool has_web_ui = 3;

  bool has_schedule = 4;
}

message ConversationSidecarIngress {
  string web_url = 1;

  string preview_hostname = 2;

  string preview_token = 3;

  google.protobuf.Timestamp preview_expire_time = 4;

  int32 loopback_port = 5;

  string ui_token = 6;
}

message PluginAuthor {
  string name = 1;

  string url = 2;
}

message PluginSkill {
  string name = 1;

  string description = 2;

  bool disable_slash_command = 3;

  string content = 4;
}

message PluginMcpServerSummary {
  string name = 1;

  string server_url = 2;
}

message PluginVariable {
  string name = 1;

  string title = 2;

  string description = 3;

  string link = 4;

  bool secret = 5;
}

message PluginVariableSpec {
  string server_url = 1;

  repeated string allowed_hosts = 2;

  string header_name = 3;

  string header_prefix = 4;

  repeated PluginVariable variables = 5;
}

message SandboxHttpHeader {
  string name = 1;

  string value = 2;
}

enum ModelTier {
  MODEL_TIER_UNSPECIFIED = 0;

  MODEL_TIER_FLASH_LITE = 1;

  MODEL_TIER_FLASH = 2;

  MODEL_TIER_PRO = 3;
}

enum TriggerCategory {
  TRIGGER_CATEGORY_UNSPECIFIED = 0;

  TRIGGER_CATEGORY_TIME = 1;

  TRIGGER_CATEGORY_EVENT = 2;
}

enum TriggerDeliveryPath {
  TRIGGER_DELIVERY_PATH_UNSPECIFIED = 0;

  TRIGGER_DELIVERY_PATH_RAP_DIRECT = 1;

  TRIGGER_DELIVERY_PATH_RAP_CRON = 2;

  TRIGGER_DELIVERY_PATH_CAPSULE_WATCHER = 3;

  TRIGGER_DELIVERY_PATH_AGENCY = 4;
}

enum TriggerState {
  TRIGGER_STATE_UNSPECIFIED = 0;

  TRIGGER_STATE_ACTIVE = 1;

  TRIGGER_STATE_PAUSED = 2;

  TRIGGER_STATE_EXPIRED = 3;

  TRIGGER_STATE_COMPLETED = 4;

  TRIGGER_STATE_ERROR = 5;
}

enum TriggerConversationMode {
  TRIGGER_CONVERSATION_MODE_UNSPECIFIED = 0;

  TRIGGER_CONVERSATION_MODE_PER_ENTITY = 1;

  TRIGGER_CONVERSATION_MODE_STATIC_SESSION = 2;

  TRIGGER_CONVERSATION_MODE_NEW_PER_EVENT = 3;
}

enum TriggerInFlightPolicy {
  TRIGGER_IN_FLIGHT_POLICY_UNSPECIFIED = 0;

  TRIGGER_IN_FLIGHT_POLICY_STEER = 1;

  TRIGGER_IN_FLIGHT_POLICY_QUEUE = 2;

  TRIGGER_IN_FLIGHT_POLICY_CANCEL_TURN = 3;

  TRIGGER_IN_FLIGHT_POLICY_SKIP = 4;
}

enum TriggerWatchMode {
  TRIGGER_WATCH_MODE_UNSPECIFIED = 0;

  TRIGGER_WATCH_MODE_PERSISTENT = 1;

  TRIGGER_WATCH_MODE_ONE_SHOT = 2;
}

enum ConversationSidecarAction {
  CONVERSATION_SIDECAR_ACTION_UNSPECIFIED = 0;

  CONVERSATION_SIDECAR_ACTION_START = 1;

  CONVERSATION_SIDECAR_ACTION_RESTART = 2;

  CONVERSATION_SIDECAR_ACTION_RUN_NOW = 3;

  CONVERSATION_SIDECAR_ACTION_ENABLE = 4;

  CONVERSATION_SIDECAR_ACTION_DISABLE = 5;
}

enum ConversationSidecarCallbackMode {
  CONVERSATION_SIDECAR_CALLBACK_MODE_UNSPECIFIED = 0;

  CONVERSATION_SIDECAR_CALLBACK_MODE_BROWSER_HOST = 1;

  CONVERSATION_SIDECAR_CALLBACK_MODE_IN_VM_CORP_PROXY = 2;

  CONVERSATION_SIDECAR_CALLBACK_MODE_IN_VM_SCOPED_TOKEN = 3;
}
