syntax = "proto3";

package exa.project_pb;

import "google/protobuf/timestamp.proto";

import "third_party/jetski/codeium_common_pb/codeium_common.proto";

option go_package = "third_party/jetski/project_pb;project_pb";

message Resource {
  oneof type {
    string folder_uri = 1;

    Google3 google3 = 2;

    GitFolder git_folder = 3;
  }
}

message Google3 {
  ForkType fork_type = 1;

  enum ForkType {
    FORK_TYPE_UNSPECIFIED = 0;

    FORK_TYPE_PIPER = 1;

    FORK_TYPE_JJ = 2;

    FORK_TYPE_FIG = 3;
  }
}

message GitFolder {
  string folder_uri = 1;

  string default_branch = 2;

  bool allow_write = 3 [deprecated = true];
}

message ProjectConversation {
  string conversation_id = 1;

  string environment_id = 2;
}

message ProjectConversations {
  repeated ProjectConversation conversations = 1;
}

message Resources {
  repeated Resource resources = 1;
}

message Environment {
  string id = 1;

  string name = 2;

  Resources resources = 3;
}

message Environments {
  repeated Environment environments = 1;
}

message PermissionGrants {
  reserved 1;

  exa.codeium_common_pb.PermissionGrantsConfig permission_grants = 2;

  bool v2_migrated = 3;
}

message SecurityPluginSettings {
  Cli cli = 1;

  Vetted vetted = 2;

  message Cli {
    bool enabled = 1;
  }

  message Vetted {
    bool enabled = 1;
  }
}

message ProjectSettings {
  exa.codeium_common_pb.AgentSettingPolicy file_access_policy = 1;

  exa.codeium_common_pb.AgentSettingPolicy internet_policy = 2;

  optional bool sandbox_mode = 3;

  exa.codeium_common_pb.CascadeCommandsAutoExecution auto_execution_policy = 4;

  exa.codeium_common_pb.ArtifactReviewMode artifact_review_mode = 5;

  bool enable_permissioned_github = 6 [deprecated = true];

  string shell_setup_script = 7;

  exa.codeium_common_pb.AgentPermissionPreset permission_preset = 8;

  map<string, SecurityPluginSettings> security_plugins = 9;
}

message Project {
  reserved 3, 4, 5;

  string id = 1;

  string name = 2;

  ProjectConversations project_conversations = 8 [deprecated = true];

  Resources project_resources = 6;

  Environments environments = 7;

  PermissionGrants permission_grants = 9;

  ProjectSettings settings = 10;

  google.protobuf.Timestamp updated_at = 11 [deprecated = true];

  optional bool is_workspace_only = 12;

  optional bool archived = 13;
}

enum FolderType {
  FOLDER_TYPE_UNSPECIFIED = 0;

  FOLDER_TYPE_NORMAL_FOLDER = 1;

  FOLDER_TYPE_GIT_FOLDER = 2;

  FOLDER_TYPE_GOOGLE3_FOLDER = 3;

  FOLDER_TYPE_NON_EXISTENT = 4;
}
